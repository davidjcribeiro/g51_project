<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — MyEnergy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@700&display=swap" rel="stylesheet">
  <style>
    [data-theme="light"]{--bg:#f4f6fb;--surface:#fff;--border:#e3e8f0;--accent:#1b6ef3;--accent-l:#e8f0fe;--text:#1c2235;--muted:#8a93a8;--heading:#0d1321;--warn:#e3450a;--warn-l:#fef0eb;--green:#0e9f6e;--green-l:#e6f9f2;--input-bg:#f4f6fb}
    [data-theme="dark"]{--bg:#0b0d13;--surface:#131720;--border:#252c3f;--accent:#4d94ff;--accent-l:rgba(77,148,255,.13);--text:#cdd3e0;--muted:#6b7280;--heading:#f0f2fa;--warn:#ff6b35;--warn-l:rgba(255,107,53,.1);--green:#00e5a0;--green-l:rgba(0,229,160,.1);--input-bg:#1a1f2e}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background .2s}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:38px 36px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .logo-bolt{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .logo-text{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:var(--heading)}
    .logo-sub{font-size:10px;color:var(--muted)}
    h1{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;color:var(--heading);margin-bottom:6px}
    .subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    input{width:100%;background:var(--input-bg);border:1.5px solid var(--border);color:var(--text);padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;border-radius:7px;transition:border-color .13s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,110,243,.1);background:var(--surface)}
    .btn-submit{width:100%;background:var(--accent);color:#fff;border:none;padding:11px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;border-radius:7px;cursor:pointer;transition:filter .13s;margin-top:8px}
    .btn-submit:hover{filter:brightness(1.1)}
    .link-row{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
    .link-row a{color:var(--accent);text-decoration:none;font-weight:600}
    .alert{padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:16px;display:flex;gap:8px;align-items:center;font-weight:500}
    .alert-error{background:var(--warn-l);color:var(--warn);border:1px solid rgba(227,69,10,.3)}
    .alert-success{background:var(--green-l);color:var(--green);border:1px solid rgba(14,159,110,.3)}
    .theme-btn{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
<button class="theme-btn" id="tb" onclick="toggleTheme()">🌙</button>
<div class="card">
  <div class="logo">
    <div class="logo-bolt">⚡</div>
    <div><div class="logo-text">MyEnergy</div><div class="logo-sub">Sistema de Gestão</div></div>
  </div>
  <h1>Bem-vindo</h1>
  <p class="subtitle">Introduza as suas credenciais para continuar.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ '✓' if cat=='success' else '✕' }} {{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <div class="form-group">
      <label>Utilizador</label>
      <input type="text" name="username" placeholder="O seu nome de utilizador" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-submit">Entrar →</button>
  </form>
  <div class="link-row">Não tem conta? <a href="{{ url_for('register') }}">Registar-se</a></div>
</div>
<script>
(function(){const s=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',s);document.getElementById('tb').textContent=s==='dark'?'☀️':'🌙'})();
function toggleTheme(){const h=document.documentElement;const n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('tb').textContent=n==='dark'?'☀️':'🌙';}
</script>
</body>
</html>
