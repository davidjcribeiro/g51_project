{% extends 'base.html' %}
{% block title %}{{ 'Editar' if row else 'Nova' }} Empresa{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('companies') }}" style="color:var(--muted);text-decoration:none">Empresas</a> / {{ 'Editar' if row else 'Nova' }}{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title">
    <small>Empresas</small>
    {{ 'Editar Empresa' if row else 'Nova Empresa' }}
  </div>
</div>

<div class="form-card">
  <form method="post">
    <div class="form-group">
      <label>Nome da Empresa</label>
      <input type="text" name="name" value="{{ row.company_name if row else '' }}" placeholder="Ex: EDP Renováveis" required>
    </div>
    <div class="form-group">
      <label>Data de Criação</label>
      <input type="date" name="creation_date" value="{{ row.company_creation_date if row else '' }}">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {{ '✓ Guardar Alterações' if row else '＋ Criar Empresa' }}
      </button>
      <a href="{{ url_for('companies') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
