{% extends 'base.html' %}
{% block title %}{{ 'Editar' if row else 'Nova' }} Rede{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('grids') }}" style="color:var(--muted);text-decoration:none">Redes</a> / {{ 'Editar' if row else 'Nova' }}{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title">
    <small>Redes</small>
    {{ 'Editar Rede' if row else 'Nova Rede' }}
  </div>
</div>

<div class="form-card">
  <form method="post">
    <div class="form-group">
      <label>Nome da Rede</label>
      <input type="text" name="name" value="{{ row.grid_name if row else '' }}" placeholder="Ex: Rede Norte Lisboa" required>
    </div>
    <div class="form-group">
      <label>Morada / Setor</label>
      <input type="text" name="address" value="{{ row.grid_address if row else '' }}" placeholder="Ex: Setor Industrial, Setúbal">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {{ '✓ Guardar Alterações' if row else '＋ Criar Rede' }}
      </button>
      <a href="{{ url_for('grids') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
